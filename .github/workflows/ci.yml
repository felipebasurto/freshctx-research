name: ci

on:
  push:
    branches:
      - main
      - feat/freshctx-next
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sidecar/treesitter/package-lock.json
      - name: Isolated Semantic Engine grammars
        run: npm --prefix sidecar/treesitter ci --omit=dev
      - name: Syntax
        run: npm run check
      - name: Invariants
        run: npm test
      - name: Synthetic comparison
        run: npm run bench
      - name: Repeated deterministic context benchmark
        run: npm run ctxbench
      - name: Empirical evaluator
        run: npm run evaluate
      - name: Paper manifest is readable
        run: npm run papers:list
      - name: Hermes Python scaffold compiles
        run: python -m py_compile adapters/hermes/__init__.py
      - name: Holdout verify (v0.1 + sealed fixtures)
        run: npm run holdout:verify -- --pack=holdout-v0.1
      - name: Holdout CI guard
        run: |
          git fetch origin main
          npm run holdout:ci-guard -- --base=origin/main

  node-compatibility:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: sidecar/treesitter/package-lock.json
      - name: Isolated Semantic Engine grammars
        run: npm --prefix sidecar/treesitter ci --omit=dev
      - run: node --test test/*.test.mjs
